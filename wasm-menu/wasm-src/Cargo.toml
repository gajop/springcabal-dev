[workspace]
resolver = "2"
members = ["menu"]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"

[workspace.dependencies]
spring = { package = "spring-sdk", git = "https://github.com/gajop/spring-rust", rev = "782c0e8a6837ec0b8ecf5f38a4d4815debc8119a" }
